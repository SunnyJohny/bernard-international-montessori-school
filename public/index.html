<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#155b9a"
    />

    <!-- =====================================================
         FAVICON AND APP ICONS
         Bernard International Montessori School
         
         Put the Bernard logo here:
         /public/images/bernard-logo.png
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/images/bernard-logo.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="%PUBLIC_URL%/images/bernard-logo.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="%PUBLIC_URL%/images/bernard-logo.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/images/bernard-logo.png"
    />

    <!-- =====================================================
         WEB APP MANIFEST
    ====================================================== -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <meta
      name="title"
      content="Bernard International Montessori School – Equipping Tomorrow's Leaders Today"
    />

    <meta
      name="description"
      content="Bernard International Montessori School in Jos provides a nurturing and engaging learning environment focused on strong academic foundations, child-centred learning, creativity, character development, and preparing children for the future."
    />

    <meta
      name="keywords"
      content="Bernard International Montessori School, Bernard Montessori School, Montessori School Jos, School in Jos, School in Plateau State, Montessori Education, Nursery School Jos, Primary School Jos, Admissions Jos, Quality Education Jos, Child Centred Learning, Education Plateau State"
    />

    <meta
      name="author"
      content="Bernard International Montessori School"
    />

    <!-- =====================================================
         OPEN GRAPH
         Used when the website is shared on platforms such as
         Facebook, WhatsApp and other social platforms.
    ====================================================== -->

    <meta
      property="og:title"
      content="Bernard International Montessori School – Equipping Tomorrow's Leaders Today"
    />

    <meta
      property="og:description"
      content="Discover Bernard International Montessori School in Jos — a nurturing learning environment committed to building strong academic foundations, creativity, confidence, character, and tomorrow's leaders."
    />

    <meta
      property="og:image"
      content="%PUBLIC_URL%/images/bernard-logo.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Bernard International Montessori School"
    />

    <!-- =====================================================
         TWITTER / X CARD
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Bernard International Montessori School – Equipping Tomorrow's Leaders Today"
    />

    <meta
      name="twitter:description"
      content="Explore Bernard International Montessori School in Jos. Discover our learning environment, admissions, school news, activities and gallery."
    />

    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/images/bernard-logo.png"
    />

    <!-- =====================================================
         BROWSER TITLE
    ====================================================== -->

    <title>
      Bernard International Montessori School
    </title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
